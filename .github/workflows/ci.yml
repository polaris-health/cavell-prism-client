# Required PR checks. The check name GitHub reports is jobs.<id>.name when
# set, else the job id - these jobs deliberately have NO name so the ids
# (branch-guard, check, test (3.11) ... test (3.14)) are the
# contexts the rulesets require. Keep both stable together. No paths
# filters: a required check that never runs blocks the PR forever.
name: CI

on:
  pull_request:
    # 'edited' re-runs the guard when an open PR is retargeted
    types: [opened, synchronize, reopened, edited]
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check source branch
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          case "$BASE" in
            main)
              [ "$HEAD_REPO" = "$THIS_REPO" ] || { echo "::error::Fork PRs cannot target main"; exit 1; }
              [ "$HEAD" = "develop" ] || { echo "::error::PRs to main must come from develop (got: $HEAD)"; exit 1; }
              ;;
            *)
              echo "Base '$BASE' has no source-branch restriction - pass."
              ;;
          esac

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
