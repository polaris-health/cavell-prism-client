# Stable release: annotated tag vX.Y.Z on main -> build -> publish to PyPI
# via trusted publishing (OIDC, environment 'pypi', no long-lived tokens).
name: Publish Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the ancestry check below needs history
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Verify tag matches the package version and sits on main
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(uvx --from hatch==1.15.1 hatch version)"
          [ "$TAG" = "$VER" ] || { echo "::error::Tag v$TAG != __version__ $VER (src/cavell_client/__init__.py). Delete the tag (git tag -d v$TAG && git push origin :refs/tags/v$TAG), bump the version via PR, re-tag."; exit 1; }
          case "$VER" in
            *dev*|*rc*|*a*|*b*) echo "::error::Refusing to publish pre-release version $VER from a release tag"; exit 1;;
          esac
          git fetch origin main
          # First-parent only: mid-cycle develop commits are ancestors of main
          # after a promotion merge but are NOT reviewed release points.
          git rev-list --first-parent origin/main | grep -qxF "$(git rev-parse "$GITHUB_SHA^{commit}")" || { echo "::error::Tag commit is not on main's first-parent line. Tag the promotion merge commit on main."; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/cavell-prism-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
