# Nightly pre-release from develop: skipped when develop hasn't moved since
# the last successful nightly. Stamps <version>.dev<UTC timestamp> into the
# workspace copy only (never committed) and publishes to PyPI via trusted
# publishing (OIDC, environment 'pypi-nightly').
#
# Versioning convention: __version__ on develop is always the NEXT stable
# version, so nightlies sort below the eventual release. Bump it right after
# every stable release.
name: Publish Nightly

on:
  schedule:
    - cron: '17 5 * * *'  # runs on the default branch (develop)
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if develop is unchanged since the last nightly
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.compare.outputs.publish }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force requested - publishing regardless of changes"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-nightly.yml/runs?status=success&branch=develop&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [ "$LAST" = "$GITHUB_SHA" ]; then
            echo "develop unchanged since the last nightly - skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Stamp dev version (workspace only)
        # Written directly into the version file: `hatch version` refuses the
        # stamp because PEP 440 orders X.Y.Z.devN *below* X.Y.Z — which is
        # exactly right for a pre-release of the upcoming X.Y.Z.
        run: |
          BASE="$(uvx --from hatch==1.15.1 hatch version)"
          case "$BASE" in
            *dev*) echo "::error::develop already carries a dev version ($BASE)"; exit 1;;
          esac
          DEV="${BASE}.dev$(date -u +%Y%m%d%H%M)"
          sed -i "s/^__version__ = .*/__version__ = \"$DEV\"/" src/cavell_client/__init__.py
          [ "$(uvx --from hatch==1.15.1 hatch version)" = "$DEV" ] || { echo "::error::version stamp failed"; exit 1; }
          echo "Stamped $DEV"
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-nightly
      url: https://pypi.org/p/cavell-prism-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
